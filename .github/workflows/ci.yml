name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# Read-only unless a job asks for more. This repository's default token
# is read-write, and a workflow that declares nothing inherits it, so every
# job here would otherwise hold a write token beside actions it does not
# pin.
permissions:
  contents: read

jobs:
  test:
    name: test / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: rust-img-vmdk
      - uses: actions/checkout@v4
        with:
          repository: antimatter-studios/rust-fs-core
          # ONE CHECKOUT, SERVING BOTH THINGS CORE IS HERE FOR: the library
          # Cargo.toml resolves rust-fs-core from, and the checkout whose
          # ../rust-fs-core/scripts/output-budget.sh the tiers run.
          #
          # They were two, at two refs. The library pin was held at v0.2.10
          # because from v0.2.11 a write past the end of a FileDevice is a
          # refusal (rust-fs-core#70, #75) and appending a grain was how this
          # format allocated; the wrapper needs v0.2.13, the first release
          # that answers `--version` the way tier.sh requires. #121 made
          # allocation ask for the room with set_len, so the library pin moved
          # to the number the tooling already needed (#123).
          ref: v0.3.7
          path: rust-fs-core
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-img-vmdk
      - name: build
        working-directory: rust-img-vmdk
        # `--features cli` so the command-line tool (the `rust-img-vmdk`
        # target, which requires it) is built, tested and linted on every
        # leg, not only in the `cli` job below.
        run: cargo build --locked --all-targets --features cli
      - name: test
        working-directory: rust-img-vmdk
        # QUIET BY DEFAULT: the whole run goes to tmp/logs/debug.log and is
        # uploaded below; this step prints a verdict line and the
        # executed-test count. A failure prints one line naming that log and
        # exits with the suite's own status -- the tail is opt-in
        # (OUTPUT_BUDGET_FAIL_TAIL), so the artefact below is how the whole
        # run is read. See the measured budget table at the top of
        # chores.yml, and ../rust-fs-core/scripts/tier.sh.
        #
        # EXPECT_OVERFLOW_CHECKS ARMS THE ONE CHECK A TEXT SCAN CANNOT DO.
        # This run has no `--release`, so overflow-checks are on, and it is
        # what makes every arithmetic test in this crate mean anything. The
        # variable tells `overflow_checks::the_build_the_gate_asked_to_check
        # _does_check` in src/lib.rs that THIS is the run that must trap an
        # overflow. It is an `env:` mapping rather than an inline prefix
        # because this job also runs on windows-latest, where that prefix is
        # a PowerShell syntax error. Do not add `--release` and do not drop
        # the variable: tests/ci_profile.rs reads this file and fails if no
        # `cargo test` in it runs without `--release` while setting it (#77).
        #
        # THE FLOOR IS IN THIS STEP NOW, not in an `if: always()` step after
        # it. It used to live there so that a failing run still printed its
        # log; the tier wrapper prints the tail itself and the artefact keeps
        # the whole thing, so the reason is gone -- and a step carrying `if:`
        # is not one the pull-request gate reads, which made the floor
        # invisible to the guards in tests/ci_profile.rs.
        #
        # `cargo test` exits 0 on "0 passed; 0 failed", so a filter that
        # selects nothing, a build that produced no test binaries, or a
        # `tests/` directory that stopped being compiled all report the same
        # green as a full run -- and the empty run is also the one that fits
        # its output budget best. That is the "fake coverage" a CI audit across
        # the sibling repositories was opened for. Measured
        # 2026-09-17 on run 35174300791 (main, 15aa277): 211 executed on each
        # of the three legs; this branch runs 250. The floor is
        # 230, about ten percent below, and it moves UP with the suite
        # and never down.
        #
        # `shell: bash` on every runner, because the tier scripts are bash
        # and the default shell on windows-latest is PowerShell.
        shell: bash
        run: |
          bash ../rust-fs-core/scripts/tier.sh "test (debug)" debug 400 27000 -- cargo test --locked --all-targets --features cli
          bash ../rust-fs-core/scripts/test-floor.sh debug 225
        env:
          EXPECT_OVERFLOW_CHECKS: "1"
      - name: keep the tier log
        # `always()`, so the log survives the failure it exists to explain.
        # A failing tier prints one line naming this log and nothing else;
        # this is what keeps the WHOLE run once the runner is gone, and it is
        # the only way to read it.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier-logs-test-${{ matrix.os }}
          path: rust-img-vmdk/tmp/logs/
          if-no-files-found: warn
          retention-days: 7
      - name: clippy
        working-directory: rust-img-vmdk
        run: cargo clippy --locked --all-targets --features cli -- -D warnings

  # THE PROFILE THAT SHIPS IS NOT THE PROFILE THE TESTS RUN IN.
  #
  # Debug turns an integer overflow into a panic; release lets it wrap.
  # So a test guarding against a wrapping computation passes `cargo
  # test` for the WRONG REASON -- the panic -- while the behaviour it
  # guards against is still live in the built library. The test is green
  # and the defect is shipped.
  #
  # That is not hypothetical in this family of crates. `am-partitions`
  # had a GPT writer that committed a table it could not read back, and
  # the two profiles gave two different panic locations: in debug the
  # library's own overflow check fired, in release the write returned
  # `Ok(())` and only the test caught it. This crate has the same shape
  # of arithmetic -- grain tables, extent offsets, sector counts scaled
  # by 512 -- and until now tested only the profile that hides it.
  test-release:
    name: test (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: rust-img-vmdk
      - uses: actions/checkout@v4
        with:
          repository: antimatter-studios/rust-fs-core
          # One checkout, the library AND the output-budget wrapper. See the
          # `test` job above for why it used to be two.
          ref: v0.3.7
          path: rust-fs-core
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-img-vmdk
      - name: test --release
        working-directory: rust-img-vmdk
        # ITS OWN TIER AND ITS OWN NUMBER. This is a different run selection
        # -- a different profile, built and linked separately -- so it can
        # empty on its own while the debug legs stay full, and a shared count
        # would hide that.
        #
        # Measured 2026-09-17 on run 35174300791: 211 executed; this branch
        # runs 250, and the floor is 230. The same count as debug
        # today because the same suite runs; they are recorded and checked
        # separately because nothing makes them stay equal.
        #
        # THE PIPE IS GONE, and with it the reason this step had to re-raise
        # `PIPESTATUS[0]` by hand. ../rust-fs-core/scripts/tier.sh redirects rather than
        # pipes, so the status on the floor line is the suite's own.
        shell: bash
        run: |
          bash ../rust-fs-core/scripts/tier.sh "test (release)" release 460 28000 -- cargo test --locked --release --all-targets --features cli
          bash ../rust-fs-core/scripts/test-floor.sh release 225
      - name: keep the tier log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier-logs-release
          path: rust-img-vmdk/tmp/logs/
          if-no-files-found: warn
          retention-days: 7

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: rust-img-vmdk
      # `cargo doc` RESOLVES THE PATH DEPENDENCY, even though `cargo fmt` does
      # not -- so this job needs core checked out and did not before the docs
      # step below was added. Same ref as every other job.
      - uses: actions/checkout@v4
        with:
          repository: antimatter-studios/rust-fs-core
          ref: v0.3.7
          path: rust-fs-core
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: fmt --check
        working-directory: rust-img-vmdk
        run: cargo fmt --check
      # THE PUBLIC DOCS BUILD, AND A BROKEN LINK IS AN ERROR.
      #
      # Nothing here built the docs, and `build`, `test` and `clippy` all
      # ignore intra-doc links, so a link to a private item or to something
      # renamed away was invisible to every gate. Three errors on `main`.
      #
      # `-D warnings` specifically. rustdoc's default is to warn and carry on,
      # which is how a page ships with its links dead and no failure anywhere
      # -- and the errors mask each other, so the count grows as the first ones
      # are fixed. The sibling rust-img-qcow2 reached eight this way
      # (qcow2#105).
      - name: cargo doc (public docs build, broken links are errors)
        working-directory: rust-img-vmdk
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps
      - name: the one required check stands for every job
        working-directory: rust-img-vmdk
        run: bash ../rust-fs-core/scripts/ci-gate.sh
      - name: the agent guide carries the shared block
        working-directory: rust-img-vmdk
        # AGENTS.md embeds agent-core, byte-identical with every sibling. This
        # runs the script directly rather than through `chore lint`, because
        # CI here does not install chore -- a guard wired only into a task
        # nothing runs is a guard that reports protection it is not providing.
        run: bash ../rust-fs-core/scripts/agents-core-check.sh
      # The shell tests, by glob, so a guard added later needs no edit here.
      - name: script tests (tests/scripts/*.sh)
        working-directory: rust-img-vmdk
        run: |
          set -euo pipefail
          for t in tests/scripts/*.sh; do
            echo "== $t"
            bash "$t"
          done
      # The family scripts are rust-fs-core's alone: this fails if a copy of
      # one is committed here, or
      # anything here still calls a local copy.
      - name: no copy of a rust-fs-core family script
        working-directory: rust-img-vmdk
        shell: bash
        run: bash ../rust-fs-core/scripts/family-check.sh

  # Cross-validates our reader/writer against `qemu-img`. qemu-img is
  # invoked as a subprocess only — never linked, never bundled. The
  # qemu-utils package is installed only on the CI runner.
  qemu-validation:
    name: qemu-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: rust-img-vmdk
      - uses: actions/checkout@v4
        with:
          repository: antimatter-studios/rust-fs-core
          # One checkout, the library AND the output-budget wrapper. See the
          # `test` job above for why it used to be two.
          ref: v0.3.7
          path: rust-fs-core
      - name: install qemu-utils
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-utils
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-img-vmdk
      - name: qemu cross-validation tests
        working-directory: rust-img-vmdk
        # THIS JOB'S FLOOR IS ITS OWN, AND IT IS THE ONE THAT MATTERS MOST.
        # The run selects a single test target behind a feature flag, so two
        # ordinary edits -- renaming the target, or letting the
        # `qemu-validation` feature stop enabling the tests behind it --
        # leave `cargo test` with nothing to run and exiting 0. The job then
        # reports green having cross-validated nothing against qemu-img,
        # which is the entire value of the job.
        #
        # Measured 2026-09-17 on run 35174300791: 26 executed. Floor 23, a
        # little under ten percent below. Small counts still get a floor --
        # a floor of 0 is not a floor.
        #
        # THE JOB ITSELF IS GUARDED NOW TOO.
        # `the_pr_gate_still_cross_validates_against_qemu_img` in
        # tests/ci_profile.rs reads this file and fails unless a gating job
        # named `qemu-validation` installs `qemu-utils` and runs `--features
        # qemu-validation --test qemu_validation`. Before it, deleting this
        # whole job left every test in the repository green -- the floor goes
        # with the step it lives in (#112).
        shell: bash
        run: |
          bash ../rust-fs-core/scripts/tier.sh qemu-validation qemu 120 9000 -- cargo test --locked --features qemu-validation --test qemu_validation
          bash ../rust-fs-core/scripts/test-floor.sh qemu 23
      # LINTED WHERE IT IS BUILT, AND ONLY HERE CAN IT BE.
      #
      # The `clippy` step in the `test` job runs `--all-targets`, which reads
      # as "everything" and is not: a `required-features` target is not built
      # unless the feature is on. So every qemu-img call and assertion in this
      # file was cfg-ed away and clippy saw an empty file. `-D warnings` is
      # enforced on every other target in this repository and was not enforced
      # on the crate's only independent oracle (#113).
      #
      # This step and the `required-features` entry in Cargo.toml go together:
      # with the entry and without this, the file would be neither run nor
      # linted by anything except the one `cargo test` above (#116).
      - name: clippy (qemu cross-validation tests)
        working-directory: rust-img-vmdk
        run: cargo clippy --locked --features qemu-validation --test qemu_validation -- -D warnings
      - name: keep the tier log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier-logs-qemu
          path: rust-img-vmdk/tmp/logs/
          if-no-files-found: warn
          retention-days: 7

  # THE COMMAND-LINE TOOL AS INSTALLED, found on PATH rather than as a
  # cargo target: `scripts/cli-install.sh` builds it in release mode and
  # stages it as an install prefix (the real `rust-img-vmdk` and
  # `img.vmdk` a relative symlink to it), then `scripts/test-cli.sh` runs
  # `rust-img-vmdk doctor` first and every tests/cli/test-*.sh after it.
  # A change that breaks the tool fails the pull request, not the release.
  #
  # The oracle is qemu-img on the runner, as in `qemu-validation`: no VM.
  # The scripts are run directly rather than through `chore cli:install` and
  # `chore test:cli`, because CI here does not install chore; chores.yml
  # runs the same two commands with the same budget and floor, which
  # tests/ci_profile.rs holds the two files to.
  cli:
    name: cli (the installed tool, on PATH)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust-img-vmdk
    steps:
      - uses: actions/checkout@v4
        with:
          path: rust-img-vmdk
      - uses: actions/checkout@v4
        with:
          repository: antimatter-studios/rust-fs-core
          # One checkout, the library AND the output-budget wrapper. See the
          # `test` job above for why it used to be two.
          ref: v0.3.7
          path: rust-fs-core
      - name: install qemu-utils, jq and man
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-utils jq man-db
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-img-vmdk
      - name: build and stage the tool (chore cli:install)
        run: scripts/cli-install.sh
      - name: the staged tool first on PATH
        run: scripts/cli-install.sh --print-bin-dir >> "$GITHUB_PATH"
      - name: the cli tier (chore test:cli)
        # Measured on 2026-09-30 on the Mac: 20 lines, 699 bytes, 218
        # checks executed; 23 lines, 781 bytes, 319 checks with `write`;
        # 26 lines, 860 bytes, 347 checks with the man pages and
        # completions. The budget leaves room for the runner's longer
        # paths, which appear in the doctor and PATH lines; the floor is
        # about 95% of the count, and moves up with the suite.
        shell: bash
        run: |
          bash ../rust-fs-core/scripts/tier.sh "test (cli)" cli 35 1300 -- bash scripts/test-cli.sh
          bash ../rust-fs-core/scripts/test-floor.sh cli 330
      # THE RELEASE TARBALL, PUT TOGETHER ON EVERY PULL REQUEST, so a release
      # is not the first time it is. rust-fs-core's package-cli (scripts/
      # core.sh package-cli) is what release.yml reaches through core's
      # release-cli workflow: it lays out the install prefix Cargo.toml's
      # [package.metadata.package-cli] declares, from the binary just built,
      # and checks the unpacked result -- every member, each dotted name a
      # relative symlink to bin/rust-img-vmdk, every man page and
      # completion, CAVEATS at most four lines, every name's --version.
      # Core's own tests hold the script to refusing each way a build can
      # be wrong; this repository keeps no copy of it.
      - name: the release tarball, built and its layout checked
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          mkdir -p tmp/package
          cd tmp/package
          bash ../../../rust-fs-core/scripts/package-cli.sh "$version" linux-x86_64 ../../target/release
      - name: keep the tier log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier-logs-cli
          path: rust-img-vmdk/tmp/logs/
          if-no-files-found: warn
          retention-days: 7

  # ONE CHECK GATES A MERGE, AND IT STANDS FOR EVERY JOB IN THIS FILE (#111).
  #
  # Branch protection names checks, and a check is a job name, so the
  # required list is a copy of the names in this file kept in a system
  # with no diff, no author and no reviewer. This repository's copy had
  # six entries — `fmt`, the three `test / <os>` matrix legs,
  # `test (release)` and `qemu-validation` — and both ways of getting it
  # wrong were one ordinary edit away.
  #
  # Add a platform to the `os:` matrix above and its leg reports on every
  # pull request while requiring nothing: green or red makes no difference
  # to the merge. That is the state the sibling rust-img-qcow2 was found
  # in, producing a `test / i686-unknown-linux-gnu` check nobody had ever
  # made required. The opposite spelling is worse. Rename a job — or write
  # `test / release` for `test (release)`, whose parentheses are literal
  # and whose name has no slash in it — and protection is left requiring a
  # name no job produces, which GitHub reads as PENDING rather than
  # failed. With enforce_admins on that is a branch nobody can merge into
  # and no failure to point at.
  #
  # `needs:` below is that list, living beside the jobs it names and
  # changed in the same diff that renames, splits or adds one. Protection
  # names `ci-ok` alone, and that name does not move when the jobs do.
  #
  # IT FAILS ON SKIPPED AND ON CANCELLED, NOT ONLY ON FAILURE. A job that
  # was skipped produced no evidence, which is exactly what this gate
  # exists to refuse; it is not a job that passed. `if: always()` is what
  # lets it judge them at all — without it the aggregate is skipped along
  # with its needs, and a skipped required check never reports, which puts
  # the branch back in the pending-forever state above.
  #
  # NOTHING FROM THE OTHER WORKFLOWS IS HERE, and `needs:` could not name
  # them if it wanted to: it only reaches jobs in its own file. That
  # matters more in this repository than in most, because release.yml runs
  # jobs called `test` and `qemu-validation` too — the same names, on a
  # `v*.*.*` tag, which happens AFTER the merge they would have gated.
  # fuzz.yml is workflow_dispatch plus a nightly cron. Neither reports on
  # a pull request at all.
  #
  # tests/ci_aggregate_gate.rs holds both halves of this: every job in
  # this file has to appear in `needs`, and .github-guard has to require
  # `ci-ok` and nothing else.
  semver:
    # `chore check:semver`, spelled out because CI here does not install chore: this tree's public API against the newest
    # version on crates.io, refusing a break the version in Cargo.toml does
    # not declare. Why, and what it cannot see, is at the top of
    # ../rust-fs-core/scripts/semver-check.sh.
    name: semver (public API against crates.io)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The version ../rust-fs-core/scripts/semver-check.sh expects. A prebuilt binary,
      # checksum-verified by the action, rather than a ten-minute build.
      CARGO_SEMVER_CHECKS_VERSION: "0.50.0"
      # A failing tier prints only its verdict by default. Here the tail IS
      # the answer -- which items broke -- so it is printed in full.
      OUTPUT_BUDGET_FAIL_TAIL: "200"
    steps:
      - uses: actions/checkout@v4
        with:
          path: rust-img-vmdk
      - uses: actions/checkout@v4
        with:
          repository: antimatter-studios/rust-fs-core
          ref: v0.3.7
          path: rust-fs-core
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-img-vmdk
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks@${{ env.CARGO_SEMVER_CHECKS_VERSION }}
      - name: semver (quiet, budgeted)
        working-directory: rust-img-vmdk
        shell: bash
        run: bash ../rust-fs-core/scripts/tier.sh semver semver 40 4000 -- bash ../rust-fs-core/scripts/semver-check.sh

  ci-ok:
    name: ci-ok
    needs: [test, test-release, fmt, qemu-validation, cli, semver]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: every gating job must have concluded success
        # `toJSON(needs)` rather than a line per job: the script then says
        # nothing about which jobs exist, so adding one to `needs:` above
        # is the whole edit and there is no second list to forget.
        #
        # No checkout and no sibling clone, unlike every other job here:
        # this one reads results, not the repository.
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad="$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")')"
          if [ -n "$bad" ]; then
            echo "::error::not green: $bad (failed, cancelled or skipped)"
            exit 1
          fi
          echo "all gating jobs succeeded"
