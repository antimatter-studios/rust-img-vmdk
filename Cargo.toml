[package]
name = "am-img-vmdk"
version = "0.3.5"
edition = "2021"
license = "MIT"
description = "Pure-Rust VMDK (VMware Virtual Machine Disk) read+write driver. Monolithic sparse variant, BlockDevice-backed. Exposes a Rust API and a C ABI."
repository = "https://github.com/antimatter-studios/rust-img-vmdk"

# The fuzz crate is its own package, on its own toolchain, and is not
# part of this one. Without this, `cargo package` and `cargo publish`
# try to include it and fail on the nightly-only dependency.
exclude = ["fuzz"]

[lib]
name = "vmdk"
crate-type = ["staticlib", "rlib"]

[features]
# Enables the qemu-img cross-validation test binary. Off by default so
# `cargo test` does not require qemu-img on PATH. CI installs qemu-utils
# and runs `cargo test --features qemu-validation --test qemu_validation`
# in a dedicated job. qemu-img is invoked as a subprocess only — never
# linked, never bundled into our release artifacts.
qemu-validation = []

[dependencies]
am-fs-core = { path = "../rust-fs-core", version = "0.2.13" }
# zlib inflation for stream-optimized grains (#48). The pure-Rust
# miniz_oxide backend: MIT/Apache-2.0, and no C in the build.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
# YAML parser for tests/ci_profile.rs, which reads .github/workflows/ci.yml
# and refuses if the debug run that lets the PR gate see an arithmetic
# overflow has been removed or disabled. It PARSES the file rather than
# scanning its text: quoted keys, block scalars, comments and nested
# mappings are the grammar, not edge cases, and a guard that misreads
# its input reports protection it is not providing. Pure Rust, YAML 1.2
# (so GitHub's `on:` key stays the string `on` and is not folded into a
# boolean), MIT/Apache-2.0, and no C to transpile -- unlike serde_yaml,
# which is deprecated and wraps unsafe-libyaml. Dev-only: it never
# reaches a consumer of this crate. Same version as the siblings, so the
# copies of this guard stay one answer rather than several.
saphyr = "0.0.12"
# JSON parsing for `qemu-img info --output=json` in the qemu-validation
# test harness. Test-only.
serde_json = "1"
toml = "1.1.5"

# TAKEN OUT OF `--all-targets`, AND THAT IS THE POINT.
#
# tests/qemu_validation.rs opens with `#![cfg(feature = "qemu-validation")]`,
# so with the feature off the whole binary is empty. Without this entry
# `cargo test --locked --all-targets` -- the debug matrix and the release
# job -- built it, ran it and printed
#
#     Running tests/qemu_validation.rs
#     test result: ok. 0 passed; 0 failed; ...
#
# a passing line under the cross-validation suite's own name, for a run that
# validated nothing. `0 passed` and `26 passed` read the same to anyone
# scanning, and the executed-test floor cannot tell them apart either: it
# sums `passed` counts, and a zero adds nothing.
#
# `required-features` makes cargo skip the target instead, so the line is
# ABSENT rather than green. tests/feature_gated_targets.rs holds every
# feature-gated test target to having one, and the `qemu-validation` job --
# which names both halves, `--features qemu-validation --test
# qemu_validation` -- is unaffected. See #116.
[[test]]
name = "qemu_validation"
path = "tests/qemu_validation.rs"
required-features = ["qemu-validation"]

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "unwind"

[profile.dev]
opt-level = 1
panic = "unwind"
