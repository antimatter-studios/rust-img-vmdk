version: "3"
chore_min_version: 0.6.0

# THE CONTRACT THIS FILE EXISTS TO OWN.
#
# How to build rust-img-vmdk is knowledge that belongs to rust-img-vmdk. It used to live in
# a consumer's build-img-containers.sh, a 205-line script that knew the
# target triple, the cargo profile, the `[lib].name` of four crates and where
# cargo puts things — none of which is a consumer's business.
#
# `staticlib` is the whole interface a consumer needs, AND IT TAKES NO
# OUTPUT DIRECTORY. It builds into this crate's own dist/; `chore artifact`
# prints the absolute path of that DIRECTORY, and a consumer copies its
# contents. It is the same pair of tasks, with the same contract, that
# every sibling library exposes.
#
# `artifact` PRINTS A DIRECTORY, NOT A FILE. That is the one place this
# differs from rust-blk-probe, whose single binary lets its `artifact` name
# a file: this crate produces libimg_vmdk.a AND the headers beside it, so
# there is no single path to name.
#
# WHY fs_core.h IS COPIED TOO. include/img_vmdk.h opens with
# `#include "fs_core.h"` — this crate's C ABI hands out FsCoreDevice handles —
# so a consumer given only img_vmdk.h cannot compile. The path below is the same
# one Cargo.toml resolves rust-fs-core from, and NOTHING CHECKS THAT THE TWO
# AGREE.
# QUIET BY DEFAULT, --verbose ON REQUEST, AND THE BUDGET IS A NUMBER.
#
#   A test task prints a VERDICT: one line per tier, a final count, and the
#   path of the log holding everything else. A failure prints one line naming
#   that log and exits with the suite's own status; the tail is opt-in
#   (`OUTPUT_BUDGET_FAIL_TAIL=40`), because the reader who pays most for it
#   re-reads its transcript on every later step. `chore test -- --verbose`
#   (or OUTPUT_BUDGET_VERBOSE=1) streams the whole run as it happens.
#
#   THE VARIABLE WAS FLTH_VERBOSE. It was renamed when the wrapper became
#   rust-fs-core's; the old name is not read, and setting it leaves the run
#   quiet rather than erroring.
#
#   Nothing is thrown away: every tier's output goes to tmp/logs/<tier>.log
#   in full, and CI uploads that directory as an artefact. What changed is
#   where it is read from.
#
#   Each tier carries an OUTPUT BUDGET -- a line count and a byte count that
#   fail the run (exit 65) when the tier prints more than it is allowed to,
#   told apart from a failing suite by its status. The budgets below are
#   MEASURED, on an arm64 Linux host, and confirmed against the verdict lines
#   of the CI run recorded in the pull request that introduced them -- the
#   largest of the three matrix legs in each case.
#
#     tier     measured        budget         headroom, and why
#     debug      353 / 21,990    400 / 27,000  ~12% / ~19%: 280 executed
#                                              tests at one line each. The
#                                              job has a separate build step,
#                                              so no `Compiling` lines land
#                                              here
#     release    397 / 23,919    460 / 28,000  ~14% / ~15%: the same selection
#                                              in the other profile. A build
#                                              step before the tier
#                                              (`--no-run`) keeps a cold
#                                              cache's `Compiling` lines out
#                                              of it (#161); warm on main run
#                                              37545462055 it was 350 / 21,960
#     qemu        34 /  2,125    120 /  9,000  26 cross-validated images. A
#                                              build step before the tier
#                                              compiles the target, which the
#                                              feature gate keeps out of
#                                              `--all-targets` (#161); warm
#                                              on main run 37545462055 it
#                                              was 36 / 2,338
#     cli         26 /    860     35 /  1,300  the installed tool: one line
#                                              per test file and its verdict,
#                                              and doctor's report. Paths are
#                                              longer on a runner
#
#   Re-measured 2026-09-30 on the Mac when the `cli` feature joined the debug
#   and release tiers, at 280 executed tests: debug warm, release from a
#   cold target directory, so its row carries the compile. The release
#   budget was raised with that measurement: 397 lines had reached 400.
#
#   Raise one DELIBERATELY when a tier grows, the way the executed-test
#   floors are raised -- and raise it in .github/workflows/ci.yml at the same
#   time, because tests/ci_profile.rs fails when the two files disagree. A
#   budget nobody can breach measures nothing.
#
#   THE FLOORS ARE THE OTHER HALF. A budget fails a tier that PRINTS too
#   much; nothing fails a tier that prints almost nothing because it RAN
#   almost nothing, and `cargo test` exits 0 on "0 passed; 0 failed". So
#   every tier also says how few executed tests still count as having run it.
#   Measured, and they only ever go up.
#
#   Why it is worth a task's while: a passing run that prints three hundred
#   lines hides the ten that matter, and every reader pays for it -- a person
#   scrolling, a CI log viewer, and an agent working here, which re-reads its
#   transcript on every step and so pays for one loud run many times over.
#   Measured across this constellation: 4,661M cache-read tokens against
#   9.5M of output, with command output the largest single contributor a
#   repository controls.
#
#   WHERE THE SCRIPT COMES FROM. The wrapper the budgets are enforced by is
#   rust-fs-core's scripts/output-budget.sh, run through its scripts/tier.sh
#   IN PLACE from the ../rust-fs-core checkout at the pinned version, and
#   THERE IS NO COPY OF EITHER HERE. A committed copy is a copy that drifts,
#   which is the whole of antimatter-studios/rust-fs-core#153 and #212;
#   rust-fs-core's family-check refuses one.
vars:
  TRIPLE: aarch64-apple-darwin
  # `[package].name` is rust-img-vmdk; `[lib].name` is vmdk, so cargo writes
  # libimg_vmdk.a. The header mirrors the lib name, not the package name.
  LIBNAME: img_vmdk

tasks:
  staticlib:
    desc: Build the static library and its headers into this crate's dist/
    # NO `out` ARGUMENT, deliberately. A library does not write into its
    # consumer. It builds into its own dist/ and a consumer asks where that
    # is — `chore artifact` prints the path. Inverting it that way means this
    # crate can change its output layout without every consumer knowing, and
    # it stays independently usable with no consumer at all.
    vars:
      OUT: 'dist'

    # Freshness, replacing the stamp-file and `find -newer` mtime comparison
    # the old script carried. Content checksums, so touching a file does not
    # trigger a rebuild and reverting one does not hide behind a newer mtime.
    #
    # These patterns are LITERAL on purpose. chore records a fingerprint by
    # calling fingerprint.Save WITHOUT a renderer (internal/run/run.go:313),
    # so a pattern containing {{ }} is expanded against the raw text, matches
    # nothing, and stores the empty-set hash — the task then never registers
    # as up to date.
    sources:
      - Cargo.toml
      - 'src/**/*.rs'
      - 'include/*.h'
      # fs_core.h is a source of ours because we ship it (see the cp below).
      # THIS PATH AND THE cp MUST AGREE, and nothing checks that they do.
      - '../rust-fs-core/include/fs_core.h'
      # THE GUARD IS PART OF THIS TASK, SO IT IS PART OF THE FINGERPRINT.
      #
      # The first command below runs
      # tests/header_names_the_built_library.rs, and neither that file
      # nor this one was a source -- so editing the guard left the task
      # up to date and the guard did not run. Force its body to fail,
      # change nothing else, and `chore staticlib` prints exactly
      # "task: staticlib is up to date" and executes nothing.
      #
      # A check whose result nothing re-reads, in the step that decides
      # what ships. chores.yml is here for the same reason: the command
      # list, the artefact paths and the guard's invocation all live in
      # this file, and a change to any of them changes the task.
      #
      # THE FILE THE TASK RUNS, NOT THE DIRECTORY IT LIVES IN. The
      # sibling closed this with 'tests/**/*.rs', which fingerprints
      # every file in tests/ -- 6 here -- while `cmds:` runs exactly
      # one target, so editing an unrelated test re-runs the whole task
      # including the cross-target release build it could not have
      # affected. That is rust-img-vhdx#85, and copying the fix verbatim
      # reproduces it.
      #
      # DO NOT ANSWER EITHER BY DROPPING THE ENTRY. The rule is that
      # `sources:` names what the task READS -- so if a second `--test`
      # target is ever added below, its file belongs here beside this
      # one.
      # `the_staticlib_task_fingerprints_the_tests_it_runs_and_no_others`
      # in tests/header_names_the_built_library.rs refuses both
      # directions.
      - 'tests/header_names_the_built_library.rs'
      - chores.yml

    # Templated, which is fine here where it is not fine above: UpToDate
    # renders these before expanding them, and every entry is an exact path
    # rather than a glob, so a missing artifact is caught by the pattern
    # failing to match.
    generates:
      - '{{.OUT}}/lib{{.LIBNAME}}.a'
      - '{{.OUT}}/include/{{.LIBNAME}}.h'

    cmds:
      # THE HEADER MUST NAME THE LIBRARY THIS TASK ACTUALLY BUILDS,
      # and it is checked FIRST so a mismatch costs no release build.
      #
      # include/vmdk.h said `libam_img_vmdk.a` for as long as the file
      # existed, and cargo has never produced that name -- `[lib] name`
      # is vmdk, so the artefact is libimg_vmdk.a, which is exactly what the
      # `cp` below copies. A C consumer following the header got a
      # linker error for a library nobody builds.
      #
      # THE CHECK IS THE TEST, not a copy of it in shell. An earlier
      # version of this guard grepped the header and compared what it
      # found against `lib{{.LIBNAME}}.a` -- derived from the same
      # hand-maintained variable it was checking, so the drift it
      # existed to catch passed silently. The test derives the expected
      # name from Cargo.toml's `[lib] name`, which is what actually
      # decides the artefact.
      - 'cargo test --locked --test header_names_the_built_library'
      # Idempotent, and it replaces the old script's "is the target installed"
      # `rustup target list --installed | grep` dance: rustup answers "up to
      # date" without touching the network when it is. It runs here rather
      # than in the consumer because the triple is ours.
      - 'rustup target add {{.TRIPLE}}'
      - 'cargo build --release --target {{.TRIPLE}}'
      - 'mkdir -p "{{.OUT}}/include"'
      - 'cp target/{{.TRIPLE}}/release/lib{{.LIBNAME}}.a "{{.OUT}}/lib{{.LIBNAME}}.a"'
      - 'cp include/{{.LIBNAME}}.h "{{.OUT}}/include/{{.LIBNAME}}.h"'
      - 'cp "../rust-fs-core/include/fs_core.h" "{{.OUT}}/include/fs_core.h"'

  build:
    desc: Debug build
    cmds: ['cargo build']

  test:
    desc: 'Every tier the gate runs: debug (the only profile that can see an overflow), release (the profile that ships), and the qemu-img cross-validation'
    # NOT `cargo test`. That ran the debug tier and nothing else, so the
    # two runs CI gates on -- the release profile and the qemu-img
    # cross-validation -- were first exercised after the push. These are
    # the same three tasks .github/workflows/ci.yml runs, with the same
    # budgets and the same floors; tests/ci_profile.rs checks that the
    # two files still agree.
    cmds:
      - task: test:debug
      - task: test:release
      - task: test:qemu
      # The command-line tool, built and staged from this checkout, then
      # tested as installed. A separate invocation because test:cli reads
      # PATH, and the staged directory has to come first on it.
      - task: cli:install
      - 'PATH="$(scripts/cli-install.sh --print-bin-dir):$PATH" "{{.CHORE_EXE}}" test:cli'
      # THE LAST LINE: one number across the tiers, and where the detail is.
      - bash scripts/test-verdict.sh debug release qemu cli

  test:debug:
    desc: 'The suite in the debug profile, where overflow checks are on'
    # EXPECT_OVERFLOW_CHECKS ARMS THE ONE CHECK A TEXT SCAN CANNOT DO:
    # `overflow_checks::the_build_the_gate_asked_to_check_does_check` in
    # src/lib.rs asks the build to prove it traps, rather than inferring
    # it from which spellings of "disabled" are absent from Cargo.toml.
    # Do not add `--release` here; tests/ci_profile.rs refuses a
    # workflow with no such run, and the reason is the same one (#77).
    cmds:
      - 'EXPECT_OVERFLOW_CHECKS=1 bash ../rust-fs-core/scripts/tier.sh "test (debug)" debug 400 27000 -- cargo test --locked --all-targets --features cli'
      - 'bash ../rust-fs-core/scripts/test-floor.sh debug 225'

  test:release:
    desc: 'The suite in the profile that ships: no debug_assert!, arithmetic wraps'
    # NOT A DUPLICATE OF test:debug. Debug turns an integer overflow into
    # a panic and release lets it wrap, so a test guarding a wrapping
    # computation passes the debug run for the WRONG reason. See the note
    # on the `test-release` job in .github/workflows/ci.yml.
    cmds:
      - 'cargo test --locked --release --all-targets --features cli --no-run'
      - 'bash ../rust-fs-core/scripts/tier.sh "test (release)" release 460 28000 -- cargo test --locked --release --all-targets --features cli'
      - 'bash ../rust-fs-core/scripts/test-floor.sh release 225'

  test:qemu:
    desc: 'The qemu-img cross-validation: another implementation reads what we wrote'
    # NEEDS qemu-img ON PATH. The run selects a single test target behind
    # a feature flag, so two ordinary edits -- renaming the target, or
    # letting the feature stop enabling the tests behind it -- leave
    # `cargo test` with nothing to run and exiting 0. Hence the floor,
    # and hence the guard on the job itself.
    cmds:
      - 'cargo test --locked --features qemu-validation --test qemu_validation --no-run'
      - 'bash ../rust-fs-core/scripts/tier.sh qemu-validation qemu 120 9000 -- cargo test --locked --features qemu-validation --test qemu_validation'
      - 'bash ../rust-fs-core/scripts/test-floor.sh qemu 23'

  cli:install:
    desc: 'Build the command-line tool (release, --features cli) and stage it as an install prefix: tmp/cli/bin/rust-img-vmdk, and img.vmdk a relative symlink to it'
    # The layout an install has. It prints the PATH line; `test:cli` tests
    # whatever PATH finds, so that directory goes first.
    cmds: ['scripts/cli-install.sh']

  test:cli:
    desc: 'The command-line tool AS INSTALLED, found on PATH: doctor first, then every tests/cli/test-*.sh against qemu-img'
    # Tests the installed artifact, not a cargo target: the same suite
    # checks `chore cli:install`'s staging (`chore test` puts it first on
    # PATH) and a Homebrew install. `rust-img-vmdk doctor` runs before any
    # tool is tested and fails the tier if a name is missing or shadowed,
    # naming the fix; a missing qemu-img, qemu-io, jq or man fails it too. See
    # scripts/test-cli.sh.
    #
    # BUDGET AND FLOOR, measured 2026-09-30 on the Mac: 20 lines, 699
    # bytes, 218 checks executed when the tier was added with the read
    # verbs; 23 lines, 781 bytes, 319 checks with write; 26 lines, 860
    # bytes, 347 checks with the man pages and completions, and the floor
    # rose with each count. (Each file prints `test result: ok. N passed`, which
    # test-floor.sh sums as it does cargo's.) The budget leaves room for a
    # runner's longer paths in the doctor and PATH lines; the floor is about
    # 95% of the count. The `cli` job in ci.yml carries the same numbers.
    cmds:
      - 'bash ../rust-fs-core/scripts/tier.sh "test (cli)" cli 35 1300 -- bash scripts/test-cli.sh'
      - 'bash ../rust-fs-core/scripts/test-floor.sh cli 330'

  package:cli:
    desc: 'Build the tool and package it as this machine''s release tarball in tmp/package, checking its layout (what release.yml attaches)'
    cmds:
      - task: cli:install
      - |
        set -eu
        case "$(uname -s)-$(uname -m)" in
          Darwin-arm64) label=darwin-arm64 ;;
          Linux-x86_64) label=linux-x86_64 ;;
          *) echo "package:cli: no release target for $(uname -s)-$(uname -m)" >&2; exit 1 ;;
        esac
        version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
        mkdir -p tmp/package && cd tmp/package
        bash ../../../rust-fs-core/scripts/package-cli.sh "$version" "$label" ../../target/release

  clean:
    desc: Remove this crate's cargo output
    cmds: ['cargo clean']

  artifact:
    desc: Print the absolute path of the directory holding the built outputs
    # `silent: true` is what makes this usable as a VALUE — without it chore
    # echoes each command and a caller capturing stdout gets the echo too.
    # PATTERNS.md: "a value — a flag string, a container status, a path" is a
    # task called through {{.CHORE_EXE}}.
    silent: true
    # NO `deps: [staticlib]`. chore prints "task: staticlib is up to date" on
    # STDOUT, which a caller capturing this as a value receives as PART OF THE
    # VALUE — measured on rust-blk-probe, where the capture came back as two
    # lines and the caller's path check failed. A value-returning task returns
    # a value and does nothing else; the caller builds first, then asks. Two
    # calls, on purpose.
    #
    # IT PRINTS A DIRECTORY, NOT A FILE, and that is the one place this differs
    # from rust-blk-probe's `artifact`. That crate produces a single binary, so
    # it can name a file. This one produces libimg_vmdk.a AND the headers beside it,
    # so there is no single path to name — A CONSUMER COPIES THE CONTENTS of
    # what this prints. A consumer that treats it as a file path will silently
    # copy the wrong thing.
    cmds:
      - 'cd "{{.OUT}}" && pwd -P'
    vars:
      OUT: 'dist'

  lint:
    desc: Formatting and clippy, exactly as CI runs them
    cmds:
      - bash ../rust-fs-core/scripts/agents-core-check.sh
      - task: test:scripts
      - cargo fmt --check
      - cargo clippy --locked --all-targets --features cli -- -D warnings

  test:scripts:
    desc: The shell tests (tests/scripts/*.sh), every one by glob
    # By glob, so a test added later needs no edit here -- a guard that has
    # to be registered somewhere else is a guard that gets silently skipped.
    # CI runs the same loop in the fmt job.
    cmds:
      - |
        set -eu
        for t in tests/scripts/*.sh; do
          echo "== $t"
          bash "$t"
        done

  check:semver:
    desc: Refuse a public-API break the version in Cargo.toml does not declare
    # Against the newest version on crates.io, with cargo-semver-checks: a
    # break needs the 0.x minor to move, an addition the patch. Why, and what
    # it cannot see, is at the top of the script. No `sources:` on purpose --
    # the baseline is the registry, which moves without this tree changing,
    # so a fingerprint would call a stale answer up to date.
    #
    # THE BUDGET is rust-fs-ext4's measurement of the same script: 11 lines /
    # 489 bytes passing with the baseline's rustdoc cached, one line more when
    # it is built. Its lines are fixed, not per item, so 40 / 4,000 leaves
    # room for a warning block without hiding a flood. No floor: it is one
    # check, not a suite.
    cmds:
      - 'bash ../rust-fs-core/scripts/tier.sh semver semver 40 4000 -- bash ../rust-fs-core/scripts/semver-check.sh'

  check:ci-gate:
    desc: The one required check stands for every job in ci.yml
    # A chore task naming a script, and nothing else -- the script is what can
    # be tested, reviewed and run without chore at all.
    #
    # This was tests/ci_aggregate_gate.rs. It was the wrong container twice
    # over: it parses a YAML file and compares strings, exercising nothing this
    # crate ships, and as a cargo test it counted towards the executed-test
    # floor the gate itself enforces -- so the suite could satisfy its floor
    # partly by checking its own CI config.
    cmds:
      - bash ../rust-fs-core/scripts/ci-gate.sh